# develop only. Loaded after flyway.toml when IDENTITY_DB_DEMO_SEED is set (deploy/compose.yml):
# this list replaces flyway.toml's, so it repeats its four locations and adds 05_demo, the eight
# demo people (V007). scripts/rebuild-check.sh fails if the two lists drift apart.
[flyway]
locations = [
  "filesystem:migrations/01_ddl",
  "filesystem:migrations/02_dml",
  "filesystem:migrations/03_dcl",
  "filesystem:migrations/04_tcl",
  "filesystem:migrations/05_demo",
]
